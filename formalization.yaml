# This file was assembled by Claude from metadata supplied by the author.
version: "v0.4"
project:
  name: "Triangles in sets of positive upper density in the plane"
  description: >-
    This is a Lean 4 formalization of the theorem that every Lebesgue measurable
    subset of the plane with positive upper Banach density contains a translated
    and rotated copy of every sufficiently large dilate of any fixed noncollinear
    triangle. The proof was developed using GPT 6 Astra Pro. The Lean
    formalization was generated by Claude Opus 5.5 Medium.
  authors: ["Polona Durcik"]
  responsible_maintainers: ["Polona Durcik"]
  license: "Apache-2.0"
classification:
  arxiv: ["math.CA", "math.CO"]
  msc2020: ["42B20", "05D10"]
sources:
  - title: "Triangles in the plane: a self-contained proof blueprint"
    # TODO: replace with a commit-pinned GitHub URL of blueprint/blueprint.tex once the
    # submission commit exists (the file is in this repository at blueprint/blueprint.tex).
    id: "blueprint/blueprint.tex (this repository)"
    type: "other"
    location: >-
      Theorem A (introduction) and Theorem 11.8; the analytic input is
      Theorem B / Theorem 10.4
    relationship: "formalizes"
    note: >-
      Dated November 6, 2026. Direct statement source supplied in this
      repository. Self-contained exposition including proofs of the
      three-letter density Hales–Jewett theorem and the analytic prerequisites.
      Generated by GPT 6 Astra Pro.
related_formalizations: []
status:
  scope: >-
    The registered result is Auto.triangles_in_the_plane (blueprint Theorem A,
    proved as Theorem 11.8), with every prerequisite proved in the repository,
    including the analytic smoothing estimate (blueprint Theorem B / Theorem
    10.4, Lean Auto.smoothing) and the three-letter density Hales–Jewett
    theorem. Theorem B is proved but not registered as a compared declaration.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Auto.triangles_in_the_plane"
      file: "TrianglesInThePlane/Auto/Theorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
automation:
  methods:
    - method: "agent"
      models: ["GPT 6 Astra Pro"]
      prompting_notes: >-
        Solved the problem and generated the blueprint with human oversight,
        according to README.md.
    - method: "agent"
      models: ["Claude Opus 5.5 Medium"]
      framework: "Claude Code"
      tool_setup: >-
        Lean statements and proofs were written by Claude Code following
        AGENTS.md, automation/Instructions.md, and the autoformalize skill in
        .claude/skills/autoformalize, with the progress ledger
        automation/Status.md.
      prompting_notes: "Generated the substantive Lean formalization from the blueprint."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      prompting_notes: >-
        Prepared the Palomar submission on the palomar branch: upgrade to Lean and
        Mathlib v4.35.0, port to the Lean module system with the accompanying
        proof repairs, Challenge, Solution, comparator.json and this metadata.
  notes: >-
    Model labels are reported from README.md. No costs or independent human
    review are inferred. The deliberate Challenge placeholder is excluded from
    the sorry counts.
fidelity:
  divergences: >-
    Alternative proof routes, corrections and historical intermediate
    assumptions are documented in automation/ErrorReport.md. Current exported
    theorem has no extra analytic hypotheses. In the Lean statement the triangle
    is the set {a, b, c} of three noncollinear points; measurability of E is
    null-measurability for Lebesgue measure (that is, Lebesgue measurability);
    d^*(E) is the limsup as L tends to infinity of the supremum over z of
    |E ∩ (z + [0,L]^2)| / L^2, with closed squares and values in [0, ∞]; and a
    copy of lambda Delta is a set x + R_t(lambda Delta), where R_t is the
    counterclockwise rotation by angle t.
review:
  status: "self-assessed"
  notes: >-
    The statements in TrianglesInThePlane/Auto/Theorems.lean were checked against
    the manuscript by the author. The formalization of the proof itself has not
    been reviewed line by line by a human. The Lean theorem depends only on the
    standard axioms propext, Classical.choice and Quot.sound.
alignment:
  namespace: "Auto"
  statements:
    - source: "Blueprint Theorem A (label triangles_in_the_plane), proved as Theorem 11.8 (den:main)"
      lean: "Auto.triangles_in_the_plane"
      module: "TrianglesInThePlane.Auto.Theorems"
      status: "proved"
    - source: "Blueprint Theorem B (label smoothing), proved as Theorem 10.4 (tail:smoothing)"
      lean: "Auto.smoothing"
      module: "TrianglesInThePlane.Auto.Theorems"
      status: "proved"
      note: "Proved but not a compared declaration in comparator.json."
