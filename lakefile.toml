name = "TrianglesInThePlane"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["TrianglesInThePlane"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # files start with "-- This code was generated by Claude"
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "TrianglesInThePlane"
