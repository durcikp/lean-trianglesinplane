name = "TrianglesInThePlane"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["TrianglesInThePlane", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # files start with a copyright header, not Mathlib's format
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "TrianglesInThePlane"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
